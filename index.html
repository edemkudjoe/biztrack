<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BizTrack — Business Management System</title>
<script>window.si=window.si||function(){(window.siq=window.siq||[]).push(arguments);};</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>
<script defer src="/_vercel/insights/script.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Biz<span>Track</span></div>
    <div class="login-sub">Small Business Management System</div>
    <div class="login-tabs">
      <button class="login-tab active" onclick="setRole('employer')">Employer</button>
      <button class="login-tab" onclick="setRole('employee')">Employee</button>
    </div>
    <div class="fg">
      <label id="id-lbl">Username</label>
      <input class="fi" id="l-id" value="admin" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="fg">
      <label>Password</label>
      <input class="fi" id="l-pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="login-err" id="l-err"></div>
    <button class="btn-login" id="l-btn" onclick="doLogin()">Sign In</button>
    <div class="login-hint" id="l-hint"></div>
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);text-align:center">
      <span style="font-size:12.5px;color:var(--text-muted)">Looking for a job? </span>
      <a href="/careers" style="font-size:12.5px;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline">Visit our Careers Portal →</a>
    </div>
  </div>
</div>
<div id="toast-wrap"></div>
<script src="/js/ui.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
